# Movil Buscador — esqueleto (SPRINT0, ADR-0009).
# Arranque: docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
# Solo el proxy publica puertos (80 y 443, o PROXY_PUERTO_HTTP y PROXY_PUERTO_HTTPS). api, simuladores y db viven en redes internas.
name: movil-buscador

services:
  db:
    # Postgres oficial SOLO para desarrollo y pruebas (SPRINT0 M-1 C). En el VPS se usa Supabase.
    # Sus variables (POSTGRES_*, AUTH_DB_CLAVE, AUTH_JWT_SECRETO) no se exigen al interpolar: el
    # VPS no las tiene (docker-compose.vps.yml deja db, auth-preparar y auth fuera).
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
    volumes:
      - datos-bd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]
    restart: unless-stopped

  auth-preparar:
    # Prepara el esquema auth y el usuario de GoTrue en el db local (idempotente, termina y sale).
    image: postgres:17
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - db
      - -U
      - ${POSTGRES_USER:-}
      - -d
      - ${POSTGRES_DB:-}
      - -v
      - clave_auth=${AUTH_DB_CLAVE:-}
      - -v
      - base=${POSTGRES_DB:-}
      - -f
      - /preparar.sql
    volumes:
      - ./auth/preparar.sql:/preparar.sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]
    restart: "no"

  auth:
    # Supabase Auth (GoTrue) SOLO para desarrollo y pruebas (CONTRATO-HU-01, decision 1).
    # En el VPS se usa el proyecto Supabase. Sin puerto publicado: solo la API lo alcanza.
    image: supabase/gotrue:v2.198.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://auth:9999
      GOTRUE_SITE_URL: http://localhost
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_CLAVE:-}@db:5432/${POSTGRES_DB:-}?search_path=auth&sslmode=disable
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRETO:-}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Sin registro abierto: los usuarios los crea app.cargar_usuarios (ADR-0003 §2).
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # El bloqueo por intentos lo aplica la API (ADR-0003, ADR-0011), no GoTrue.
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "100000"
      GOTRUE_RATE_LIMIT_VERIFY: "100000"
      GOTRUE_LOG_LEVEL: info
    depends_on:
      auth-preparar:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interna]
    restart: unless-stopped

  simuladores:
    build: ../services/simuladores
    environment:
      # Fotos de la galeria (HU-08, ADR-0008): se leen de SIM_FOTOS_DIR y se guardan cifradas
      # (AES-GCM) en el volumen fotos-galeria. El origen se monta con docker-compose.fotos.yml.
      SIM_FOTOS_DIR: /fotos-origen
      SIM_FOTOS_ALMACEN: /datos/fotos
      SIM_FOTOS_LLAVE: ${SIM_FOTOS_LLAVE:-}
      # Donde las pruebas encuentran los yaml de las fuentes (HU-08 v3, C6).
      CONTRATOS_FUENTES_DIR: /app/contratos/fuentes
    volumes:
      - ../services/simuladores/tests:/app/tests:ro
      # Contratos de las fuentes, para validar respuestas en las pruebas (HU-08 v3, C5 y C6).
      - ../contratos/fuentes:/app/contratos/fuentes:ro
      - fotos-galeria:/datos/fotos
    # Sin "ports": solo la API lo alcanza por la red interna (ADR-0006 §6, ADR-0009).
    networks: [interna]
    restart: unless-stopped

  api:
    build: ../services/api
    environment:
      # La API en marcha se conecta con el rol api_app (ADR-0005 §1, CONTRATO-HU-07 §1).
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL}
      # Rol dueño de las tablas: solo para migraciones (app.migrar al arrancar, alembic) y la carga
      # de usuarios (CONTRATO-HU-07 v2). Si falta, se usa DATABASE_URL.
      MIGRACION_DATABASE_URL: ${MIGRACION_DATABASE_URL:-}
      # Clave con la que app.migrar le da login a api_app. NUNCA se versiona.
      API_APP_CLAVE: ${API_APP_CLAVE:-}
      SIMULADORES_URL: ${SIMULADORES_URL:-http://simuladores:8001}
      # URL por fuente (HU-08, ADR-0006 §2). Vacia = usa SIMULADORES_URL.
      FUENTE_PLACAS_URL: ${FUENTE_PLACAS_URL:-}
      FUENTE_REQUISITORIAS_URL: ${FUENTE_REQUISITORIAS_URL:-}
      FUENTE_GALERIA_URL: ${FUENTE_GALERIA_URL:-}
      FUENTE_TIMEOUT_S: ${FUENTE_TIMEOUT_S:-3}
      # Sesion y acceso (HU-01, HU-02, ADR-0003, ADR-0011). Valores provisionales (PA #18, #19).
      AUTH_URL: ${AUTH_URL:-http://auth:9999}
      AUTH_APIKEY: ${AUTH_APIKEY:-}
      # Solo para la carga de usuarios contra el Auth local. En el VPS no llega a la API en marcha
      # (docker-compose.vps.yml), y la carga usa AUTH_ADMIN_CLAVE (DESPLIEGUE-01, decision 1).
      AUTH_JWT_SECRETO: ${AUTH_JWT_SECRETO:-}
      JWT_SECRETO: ${JWT_SECRETO:?falta JWT_SECRETO}
      SESION_INACTIVIDAD_S: ${SESION_INACTIVIDAD_S:-600}
      TOKEN_ACCESO_VIGENCIA_S: ${TOKEN_ACCESO_VIGENCIA_S:-900}
      BLOQUEO_INTENTOS: ${BLOQUEO_INTENTOS:-5}
      BLOQUEO_DURACION_S: ${BLOQUEO_DURACION_S:-900}
      CLAVE_USUARIOS_PRUEBA: ${CLAVE_USUARIOS_PRUEBA:-}
      # Formato de placa (HU-03, ADR-0011). Vacios = valores por defecto de la API (PA #20).
      PLACA_FORMATO_REGEX: ${PLACA_FORMATO_REGEX:-}
      PLACA_FORMATO_DESCRIPCION: ${PLACA_FORMATO_DESCRIPCION:-}
    volumes:
      - ../services/api/tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      simuladores:
        condition: service_healthy
    networks: [interna, borde]
    restart: unless-stopped

  proxy:
    # NGINX (DESPLIEGUE-01 v2 §1 y §2, ADR-0018): imagen oficial nginx:1.30.8-alpine + openssl
    # (infra/nginx/Dockerfile). Solo /v1/* (hacia api:8000) y /descargas/movil-buscador.apk; el
    # resto, 404. En local usa una CA propia generada al primer arranque (volumen proxy-certs, fuera
    # del repositorio; se exporta con infra/exportar-ca-local.ps1). En el VPS, Let's Encrypt
    # (docker-compose.vps.yml).
    build: ./nginx
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      CERT_MODO: local
      # Para que la redireccion de HTTP a HTTPS lleve el puerto publicado (8443 en local).
      PROXY_PUERTO_HTTPS: ${PROXY_PUERTO_HTTPS:-443}
      # Credencial unica de la descarga del APK (DESPLIEGUE-01 v2 §5, decision 5). El htpasswd se
      # genera al arrancar y la clave no queda en el entorno de NGINX. Sin ellas, la ruta da 401.
      DESCARGA_APK_USUARIO: ${DESCARGA_APK_USUARIO:-}
      DESCARGA_APK_CLAVE: ${DESCARGA_APK_CLAVE:-}
    # Puertos publicados: 80 y 443 por defecto (VPS). En un equipo donde 80 esta ocupado (por
    # ejemplo por http.sys de Windows) se usan PROXY_PUERTO_HTTP y PROXY_PUERTO_HTTPS.
    ports:
      - "${PROXY_PUERTO_HTTP:-80}:80"
      - "${PROXY_PUERTO_HTTPS:-443}:443"
    volumes:
      - proxy-certs:/etc/nginx/certs
      # Carpeta del anfitrion con movil-buscador.apk, de solo lectura (DESPLIEGUE-01 v2.1, anotacion).
      # DESCARGA_APK_DIR es relativa a infra/ o absoluta; por defecto, una carpeta hermana del
      # repositorio (fuera de el). En local, el TESTER pone ahi un archivo de prueba (decision 7).
      - ${DESCARGA_APK_DIR:-../../movil-buscador-descargas}:/srv/descargas:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [borde]
    restart: unless-stopped

networks:
  # api <-> simuladores <-> db. El proxy no entra aqui.
  interna:
  # proxy <-> api.
  borde:

volumes:
  datos-bd:
  fotos-galeria:
  # CA local y certificados del proxy (fuera del repositorio).
  proxy-certs:
