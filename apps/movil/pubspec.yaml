name: movil_buscador
description: "Movil Buscador: prototipo con datos sintéticos (MVP MININTER)."
publish_to: 'none'
version: 0.1.0+1

# Versión fijada al empezar la migración (CONTRATO-MIGRACION-FLUTTER §6, ADR-0017 regla 5).
# No se cambia hasta el cierre del MVP.
environment:
  sdk: 3.14.0
  flutter: 3.50.1

# Versiones exactas, sin "^" (CONTRATO-MIGRACION-FLUTTER §6). pubspec.lock se versiona.
dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.2
  clock: 1.1.3
  flutter_secure_storage: 11.2.0
  google_mlkit_text_recognition: 1.0.3
  http: 1.6.0
  material_ui: 1.11.1
  permission_handler: 13.0.2
  ok_http: 0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
