<style>

const p2 = n => String(n).padStart(2,'0');
function fHM(d){ return p2(d.getHours())+':'+p2(d.getMinutes()); }
function fDM(d){ return p2(d.getDate())+'/'+p2(d.getMonth()+1); }

function fSec(d){ return fDate(d)+' '+fHM(d)+':'+p2(d.getSeconds()); }

/* ================= Navegación ================= */
function homeOf(){ return S.user ? ROLE_HOME[S.user.role] : 'AUTH-01'; }
function setCur(id, p){ S.token++; S.cur = { id, p:p||{} }; render(); }
function go(id, p){
  syncDraft();
  const sc = SCREENS[id];
  if (sc.role && (!S.user || S.user.role !== sc.role)) return denied(sc.fname);
  S.stack.push(S.cur); setCur(id, p);
}
function replace(id, p){ syncDraft(); setCur(id, p); }
function back(){
  syncDraft();
  const sc = SCREENS[S.cur.id];
  if (sc.noBack) return;
  if (!S.stack.length) return;
  const prev = S.stack.pop(); setCur(prev.id, prev.p);
}
function backTo(id, p){ syncDraft(); while (S.stack.length && S.stack[S.stack.length-1].id !== id) S.stack.pop(); if (S.stack.length) S.stack.pop(); setCur(id, p); }
function resetTo(stackIds, id, p){ syncDraft(); S.stack = stackIds.map(x=>({id:x,p:{}})); setCur(id, p); }
function denied(fname){
  addLog({ user:S.user.u, tipo:'Acceso denegado', resultado:'Función: ' + fname });
  S.stack = []; setCur('ERR-01');
}
function logoutTo(msg){
  S.user = null; S.stack = []; S.draft = freshDraft();
  S.login = { msg, username: S.login.username, lockUntil: S.login.lockUntil };
  setCur('AUTH-01');
}
function syncDraft(){
  document.querySelectorAll('#app [data-bind]').forEach(el => {
    const [g,k] = el.dataset.bind.split('.');
    if (el.type === 'radio') { if (el.checked) S.draft[g][k] = el.value; }
    else S.draft[g][k] = el.value;
  });
}

function logLine(r){
  const parts = [r.tipo];
  if (r.ref) parts.push(r.ref);
  if (r.motivo) parts.push('Motivo: ' + r.motivo);
  if (r.resultado) parts.push(r.resultado);
  return parts.map(esc).join(' · ');
}
def('BIT-01', { role:'supervisor', fname:'Bitácora', noBack:true, render(){
  const F = S.bitFilter;
  const all = S.log.slice().sort((a,b)=>b.at-a.at);
  const uniq = f => [...new Set(all.map(f))];
  const sel = (k, label, vals) => `<select class="inp" data-c="bitFilter" data-k="${k}" aria-label="Filtrar por ${label}"><option value="">${label}</option>${vals.map(x=>`<option ${F[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  const rows = all.filter(r => (!F.fecha || fDate(r.at)===F.fecha) && (!F.usuario || r.user===F.usuario) && (!F.tipo || r.tipo===F.tipo));
  return roleBar('Bitácora') + `<div class="body" style="gap:10px">
    <div class="reserved" style="padding:10px"><div class="rh"><span>Filtros</span>${pa(24)}</div>
      <div class="filters">${sel('fecha','Fecha',uniq(r=>fDate(r.at)))}${sel('usuario','Usuario',uniq(r=>r.user))}${sel('tipo','Tipo',uniq(r=>r.tipo))}</div></div>
    <div class="lock">🔒 Registros de solo lectura</div>
    <div class="list">${rows.length ? rows.map(r => `<button class="card logc" data-a="bitDetalle" data-n="${r.n}">
      <span class="ct">${fShort(r.at)} · ${esc(r.user)} <span class="chip">SINTÉTICO</span> ${r.pa?pa(r.pa):''}</span>
      <span class="cl">${logLine(r)}</span></button>`).join('') : '<div class="empty">No hay registros con estos filtros.</div>'}</div>

}});

const ACT = {
  navBack(){ back(); },
  navHome(){ if (S.user) ACT.home(); },
  back(){ back(); },
  home(){ syncDraft(); S.stack = []; setCur(homeOf()); },
  logout(){ S.login.username = ''; S.login.lockUntil = 0; logoutTo(null); },
  rerender(){ syncDraft(); const errs = S.cur.p.errs; if (errs && errs.motivo) delete errs.motivo; render(); },

  /* HU-01 */
  login(){
    const u = $('#u').value.trim(), pw = $('#pw').value;
    S.login.username = u;
    const now = Date.now();
    if (S.locks[u] && now < S.locks[u]) { S.login.msg = 'lock'; S.login.lockUntil = S.locks[u]; return setCur('AUTH-01'); }
    const acc = USERS[u];
    if (acc && acc.pass === pw) {
      S.fails[u] = 0; delete S.locks[u];
      S.user = { u, role:acc.role, name:acc.name };
      S.login = { msg:null, username:'', lockUntil:0 };
      addLog({ user:u, tipo:'Inicio de sesión', resultado:'Correcto' });
      S.stack = []; S.draft = freshDraft();
      return setCur(ROLE_HOME[acc.role]);
    }
    // Se cuenta por nombre de usuario escrito, exista o no, para no revelar qué usuarios existen.
    S.fails[u] = (S.fails[u]||0) + 1;
    addLog({ user:u||'(vacío)', tipo:'Intento fallido', resultado:'Usuario o clave incorrectos' });
    if (S.fails[u] >= CFG.MAX_FAILS) {
      S.fails[u] = 0; S.locks[u] = now + CFG.LOCK_MIN*MIN;
      addLog({ user:u||'(vacío)', tipo:'Cuenta bloqueada', resultado:`${CFG.MAX_FAILS} intentos fallidos seguidos · ${CFG.LOCK_MIN} min`, pa:19 });
      S.login.msg = 'lock'; S.login.lockUntil = S.locks[u];
    } else S.login.msg = 'error';
    setCur('AUTH-01');
  },

  /* HU-02 */
  toPlaca(){ S.draft.pla = {placa:'',sel:'',otro:''}; go('PLA-01'); },
  toRostro(){ S.draft.ros = {sel:'',otro:'',id:''}; go('ROS-01'); },
  toVer(){ go('VER-01'); },

  /* HU-03 */
  consultarPlaca(){
    syncDraft();
    const d = S.draft.pla, errs = {};
    const placa = normPlate(d.placa);
    if (!placa) errs.placa = true;
    const me = motivoError('pla'); if (me) errs.motivo = me;
    if (errs.placa || errs.motivo) return setCur('PLA-01', { errs });
    d.placa = placa;
    const motivo = motivoText(d.sel, d.otro);
    setCur('PLA-04', { placa });
    const tk = S.token;
    setTimeout(() => {
      if (tk !== S.token) return;
      const at = new Date();
      const mode = S.demo.plate;
      const kind = mode === 'caida' ? 'caida' : mode === 'invalida' ? 'invalida' : mode === 'noreg' ? 'noreg' : (PLATES[placa] || 'noreg');
      if (kind === 'caida' || kind === 'invalida') {
        addLog({ user:'sistema', tipo:'Error', resultado: kind==='caida' ? 'Fuente de placas no disponible' : 'Respuesta fuera de contrato del simulador', detalle:'Placa ' + placa + ' · consulta de ' + S.user.u + ' · Motivo: ' + motivo });
        return setCur('PLA-07');   // el formulario sigue en S.draft (Reintentar conserva placa y motivo)
      }
      const res = { requisitoria:'Tiene requisitoria', sin:'Sin requisitoria registrada en la fuente consultada', noreg:'Placa no registrada en la fuente consultada' }[kind];
      const lr = addLog({ user:S.user.u, tipo:'Consulta de placa', motivo, ref:placa, resultado:res });
      const cid = 'C-' + String(lr.n).padStart(4,'0');
      lr.detalle = 'ID de la consulta: ' + cid;

      setCur({ requisitoria:'PLA-05', sin:'PLA-06', noreg:'PLA-08' }[kind], { placa, motivo, at, cid });   // en PLA-08 el formulario sigue en S.draft

  toOcr(){ syncDraft(); go(S.demo.camera === 'denegado' ? 'OCR-04' : 'OCR-01'); },
  capturarPlaca(){ S.demo.ocr === 'falla' ? replace('OCR-03') : replace('OCR-02', { placa:S.demo.ocr }); },

    const me = motivoError('ros');

    if (S.demo.people === '3') return replace('ROS-10', { sel:null });

  descartarFoto(){ ACT.repetirCaptura(); },   // HU-05 E9: no se compara, la foto se descarta, nada en la bitácora

    const d = S.draft.ros, motivo = motivoText(d.sel, d.otro);
    const rostros = { rostros: S.demo.people === '3' ? 3 : 1 };   // PA 33: solo la cantidad, sin datos de las otras personas
    replace('ROS-04');
    const tk = S.token;
    setTimeout(() => {
      if (tk !== S.token) return;
      const at = new Date();
      if (f === 'error') {
        addLog({ user:'sistema', tipo:'Error', resultado:'Servicio de comparación no responde', detalle:'Verificación de ' + S.user.u + ' · Motivo: ' + motivo });
        return setCur('ROS-08');
      }
      const captureId = rid('CAP-');
      const score = { posible:0.70, nc:0.50, sin:0.20 }[f] + Math.round(Math.random()*40)/1000;
      S.stack = [{ id:'HOME-01', p:{} }];

        addLog(Object.assign({ user:S.user.u, tipo:'Verificación de rostro', motivo, ref:vid, resultado:TXT.posible, captureId, score }, rostros));
        return setCur('ROS-05', { motivo, at, vid });
      }
      addLog(Object.assign({ user:S.user.u, tipo:'Verificación de rostro', motivo, resultado: f==='nc'?TXT.nc:TXT.sin, captureId, score }, rostros));
      setCur(f === 'nc' ? 'ROS-06' : 'ROS-07', { motivo, at });
    }, CFG.FACE_MS);
  },
  repetirCaptura(){ if (S.demo.cameraFace === 'denegado') { S.stack = [{id:'HOME-01',p:{}},{id:'ROS-01',p:{}}]; return setCur('ROS-09'); } S.stack = [{id:'HOME-01',p:{}},{id:'ROS-01',p:{}}]; setCur('ROS-02'); },
  nuevaVerif(){ S.draft.ros = {sel:'',otro:'',id:''}; resetTo(['HOME-01'], 'ROS-01'); },

  verDetalle(el){ go('VER-02', { vid:el.dataset.vid }); },
  revisar(el){ const vid = el.dataset.vid; if (S.draft.rev.vid !== vid) S.draft.rev = { vid, dec:'', mot:'' }; go('REV-02', { vid, cand:0 }); },
  cand(el){ syncDraft(); const p = S.cur.p; p.cand = (p.cand||0) + Number(el.dataset.d); render(); },
  guardarDecision(el){
    syncDraft();
    const vid = el.dataset.vid, d = S.draft.rev, errs = {};
    if (!d.dec) errs.dec = true;
    if (!d.mot.trim()) errs.mot = true;
    if (errs.dec || errs.mot) return setCur('REV-03', { vid, cand:S.cur.p.cand, errs });
    const v = S.verifs.find(x => x.id===vid);
    const at = new Date();
    v.estado = 'revisada'; v.decision = d.dec; v.decisionAt = at; v.reviewer = S.user.u;
    addLog({ user:S.user.u, tipo:'Decisión de revisión', ref:vid, resultado:DECISION[d.dec].log, detalle:'Motivo de la decisión: ' + d.mot.trim() });
    addLog({ user:'sistema', tipo:'Captura eliminada', ref:vid, resultado:'Causa: decisión del revisor', captureId:v.captureId });
    const dec = d.dec;
    S.draft.rev = { vid:null, dec:'', mot:'' };
    S.stack = [];
    setCur('REV-04', { vid, dec, at });
  },

  /* HU-10 */
  compAbrir(el){
    const f = el.dataset.f, cid = el.dataset.cid, p = S.cur.p;
    const c = S.comp[cid] || (S.comp[cid] = { placa:p.placa, motivo:p.motivo });

    go('COM-01', { f, cid, placa:c.placa }); ACT.compConsultar(f, cid);
  },
  compConsultar(f, cid){
    const c = S.comp[cid], tk = S.token;
    setTimeout(() => {
      if (tk !== S.token) return;
      const at = new Date(), mode = S.demo[f];
      const base = { motivo:c.motivo, ref:c.placa, detalle:'Consulta de origen: ' + cid };
      if (mode === 'error') {
        c[f] = { err:true };
        addLog(Object.assign({}, base, { user:'sistema', tipo:'Error', resultado: FUENTE[f] + ' no disponible', detalle:'Placa ' + c.placa + ' · consulta de ' + S.user.u + ' · ' + base.detalle }));
        return replace('COM-05', { f, cid });
      }
      if (f === 'sunarp') {
        const data = mode === 'noreg' ? null : (VEH[c.placa] || null);
        c.sunarp = data ? { at, data } : { at, noreg:true };
        addLog(Object.assign({ user:S.user.u, tipo:'Consulta SUNARP (simulada)', resultado: data ? 'Características registradas mostradas' : 'Placa no registrada en SUNARP (simulado)' }, base));
        return replace('COM-02', { cid });
      }
      const data = SAT[c.placa] || { n:0, monto:0, grave:false };
      c.sat = { at, data };
      addLog(Object.assign({ user:S.user.u, tipo:'Consulta de papeletas SAT Lima (simulada)', resultado: data.n ? `${data.n} pendientes · S/ ${data.monto} · grave: ${data.grave?'sí':'no'}` : 'Sin papeletas pendientes registradas en SAT Lima' }, base));
      replace('COM-04', { cid });
    }, CFG.PLATE_MS);
  },

/* Enlaces directos (para probar ERR-01). El control real está en el backend (supuesto de HU-02). */
const ROUTES = { '#/placa':'PLA-01', '#/rostro':'ROS-01', '#/mis-verificaciones':'VER-01', '#/revision':'REV-01', '#/bitacora':'BIT-01' };
function openRoute(hash){
  const id = ROUTES[hash];
  if (!id || !S.user) return render();
  const sc = SCREENS[id];
  if (sc.role !== S.user.role) return denied(sc.fname);
  S.stack = [{ id:homeOf(), p:{} }]; setCur(id);
}
window.addEventListener('hashchange', () => {
  const h = location.hash;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* file:// en algunos navegadores */ }
  openRoute(h);
});

/* ================= Render ================= */
function demoPanel(){
  const D = S.demo;
  const sel = (k, label, opts, note) => `<label class="sl">${label}<select data-c="demo" data-k="${k}">${opts.map(([v,t])=>`<option value="${v}" ${D[k]===v?'selected':''}>${t}</option>`).join('')}</select>${note?`<span class="dnote">${note}</span>`:''}</label>`;
  return `<div class="sheet-bg" data-a="demoClose"><div class="sheet" role="dialog" aria-label="Panel de demo">
    <div class="grab"></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>Panel de demo (prototipo)</h2><button class="ib" data-a="demoClose" aria-label="Cerrar">✕</button></div>
    <div class="dnote">Herramienta del facilitador. No es parte del producto.</div>
    <h3>Simuladores (HU-08)</h3>
    ${sel('plate','Respuesta de placa',[['auto','Según placa sintética'],['noreg','Forzar placa no registrada'],['caida','Forzar fuente caída'],['invalida','Forzar respuesta inválida']],'ABC-123 tiene requisitoria · DEF-456 sin requisitoria · GHI-789 fuente caída · XYZ-999 (y cualquier otra) no registrada')}
    ${sel('face','Respuesta de rostro',[['posible','Posible coincidencia'],['nc','No concluyente'],['sin','Sin coincidencia'],['error','Error del servicio'],['q-frente','Calidad: Mire de frente'],['q-luz','Calidad: Más luz'],['q-borrosa','Calidad: Imagen borrosa'],['q-sinrostro','Calidad: Sin rostro'],['q-juntos','Recorte: rostros muy juntos (ADR-0015)']],'Con tres personas, la calidad se aplica solo al rostro elegido.')}
    ${sel('people','Personas en la foto (HU-05 E8)',[['1','Una'],['3','Tres (se elige un rostro)'],['6','Seis (más de 5: se rechaza)']])}
    ${sel('camera','Cámara (placa)',[['ok','Permiso concedido'],['denegado','Permiso denegado']])}
    ${sel('cameraFace','Cámara (rostro)',[['ok','Permiso concedido'],['denegado','Permiso denegado o retirado']],'Denegado: ROS-09 al continuar a cámara (HU-05 E6). Retirado: elegirlo estando en la captura y tocar Capturar (E7).')}
    ${sel('ocr','Lectura de placa',[['ABC-123','Lee ABC-123'],['DEF-456','Lee DEF-456'],['GHI-789','Lee GHI-789'],['falla','Falla la lectura']])}
    <h3>Consultas complementarias (HU-10)</h3>
    ${sel('sunarp','SUNARP (simulado)',[['auto','Según placa sintética'],['noreg','Forzar placa no registrada'],['error','Forzar error']],'ABC-123 y DEF-456 tienen datos; otra placa: no registrada')}
    ${sel('sat','SAT Lima (simulado)',[['auto','Según placa (ABC-123: 3 papeletas · DEF-456: ninguna)'],['error','Forzar error']])}
    <h3>Aviso simulado al 105 (HU-09)</h3>
    ${sel('loc','Permiso de ubicación',[['preguntar','Aún no pedido (muestra el diálogo)'],['ok','Concedido'],['denegado','Denegado']])}
    ${sel('gps','Lectura de la ubicación',[['ok','Responde'],['sinfix','GPS apagado o sin respuesta']])}
    ${sel('avisoReg','Registro del aviso',[['ok','Se registra'],['error','Falla (AVI-03)']])}
    <h3>Variantes de puntos abiertos</h3>
    <div class="fixed"><b>PA 2:</b> revisor separado (ADR-0003). La variante «mismo usuario» no se incluye: un agente nunca revisa su propia consulta.</div>
    ${sel('pa7','PA 7 · Tipo de comparación',[['lista','Lista acotada'],['1a1','1:1']])}
    ${sel('pa15','PA 15 · Resultado de placa',[['solo','Solo estado'],['datos','Estado + datos (campos por definir)']],'Valor provisional: solo estado.')}
    <label class="tg"><input type="checkbox" data-c="demoChk" data-k="marks" ${D.marks?'checked':''}> Mostrar marcas de PA</label>
    <label class="tg"><input type="checkbox" data-c="demoChk" data-k="ids" ${D.ids?'checked':''}> Mostrar ID de pantalla</label>
    <h3>Eventos</h3>
    <button class="dbtn" data-a="demoInact">Cerrar sesión por inactividad (PA 18)</button>
    <button class="dbtn" data-a="demoLock">Bloquear cuenta de jperez (simular 5 intentos · PA 19)</button>
    <button class="dbtn" data-a="demoUnlock">Desbloquear cuentas</button>
    <button class="dbtn" data-a="demoExpire">Vencer pendientes (simular 24 h · PA 23)</button>
    <button class="dbtn" data-a="demoDirect" ${S.user?'':'disabled'}>Abrir enlace directo a una función de otro rol</button>
    <button class="dbtn" data-a="demoReset">Reiniciar prototipo</button>
    <div class="dnote" style="margin-top:8px">Usuarios: jperez · revisor1 · supervisor1 — clave demo123</div>
  </div></div>`;
}
function render(){
  const sc = SCREENS[S.cur.id];
  const html = sc.render(S.cur.p || {});
  const sid = sc.idOf ? sc.idOf(S.cur.p || {}) : S.cur.id;
  document.body.classList.toggle('nomarks', !S.demo.marks);
  $('#app').innerHTML = `<div class="synth">DATOS SINTÉTICOS · PROTOTIPO</div>
    <main class="scr ${sc.dark?'dark':''}" id="scr" aria-label="${sid}">${html}</main>
    ${S.demo.ids ? `<div class="idbadge">${sid}</div>` : ''}
    <button class="fab" data-a="demoOpen" aria-label="Abrir panel de demo">⚙ Demo</button>
    ${S.demo.open ? demoPanel() : ''}`;
  const inv = document.querySelector('#scr .invalid');
  if (inv) { const f = inv.matches('input,select,textarea') ? inv : inv.querySelector('input'); if (f) f.focus(); }
}

/* ================= Eventos ================= */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.classList.contains('sheet-bg') && ev.target !== el) return;
  const fn = ACT[el.dataset.a];
  if (fn) { ev.preventDefault(); fn(el); }
});
document.addEventListener('submit', ev => { const a = ev.target.dataset.submit; if (a) { ev.preventDefault(); ACT[a](); } });
document.addEventListener('change', ev => {
  const el = ev.target, c = el.dataset.c;
  if (c === 'rerender') ACT.rerender();
  if (c === 'demo') { S.demo[el.dataset.k] = el.value; render(); }
  if (c === 'demoChk') { S.demo[el.dataset.k] = el.checked; render(); }
  if (c === 'bitFilter') { S.bitFilter[el.dataset.k] = el.value; render(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.demo.open) ACT.demoClose();
  if (ev.key === 'Enter' && ev.target.id === 'placa') { ev.preventDefault(); ACT.consultarPlaca(); }
});

function fit(){
  const mobile = window.innerWidth <= 500;
  document.body.classList.toggle('mobile', mobile);
  if (!mobile) { const s = Math.min(1, (window.innerHeight - 24) / 935, (window.innerWidth - 24) / 432); $('#phone').style.transform = `scale(${s})`; }
}
function tick(){ $('#clock').textContent = fHM(new Date()); }
window.addEventListener('resize', fit);
fit(); tick(); setInterval(tick, 20000);
render();
</script>
</body>
</html>
