<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="fl" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="fli" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="750.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Modelo entidad-relación físico (PostgreSQL 17) — tablas implementadas</text><rect x="40" y="70" width="380" height="134" rx="4" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/><rect x="40" y="70" width="380" height="26" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="230.0" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">usuario_perfil</text><text x="48" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">PK id uuid</text><text x="48" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">usuario text NOT NULL UNIQUE</text><text x="48" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">nombre text NOT NULL</text><text x="48" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">rol text NOT NULL CHECK (agente|revisor|supervisor)</text><text x="48" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">activo boolean NOT NULL DEFAULT true</text><text x="48" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">es_sintetico boolean NOT NULL DEFAULT true</text><rect x="520" y="70" width="420" height="150" rx="4" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/><rect x="520" y="70" width="420" height="26" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="730.0" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">sesion</text><text x="528" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">PK id uuid DEFAULT gen_random_uuid()</text><text x="528" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">FK usuario_id uuid NOT NULL → usuario_perfil.id</text><text x="528" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">token_renovacion_hash text NOT NULL UNIQUE</text><text x="528" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">creada_en timestamptz NOT NULL DEFAULT now()</text><text x="528" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">ultima_actividad timestamptz NOT NULL DEFAULT now()</text><text x="528" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">estado text NOT NULL CHECK (activa|cerrada|vencida)</text><text x="528" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">es_sintetico boolean NOT NULL DEFAULT true</text><rect x="40" y="330" width="380" height="118" rx="4" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/><rect x="40" y="330" width="380" height="26" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="230.0" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">control_acceso</text><text x="48" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">PK usuario text</text><text x="48" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">usuario_id uuid NULL  (sin FK: cuenta inexistente)</text><text x="48" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">intentos_fallidos integer NOT NULL DEFAULT 0</text><text x="48" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">bloqueado_hasta timestamptz NULL</text><text x="48" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">es_sintetico boolean NOT NULL DEFAULT true</text><rect x="40" y="540" width="380" height="102" rx="4" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/><rect x="40" y="540" width="380" height="26" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="230.0" y="558" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">motivo_catalogo</text><text x="48" y="584" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">PK codigo text</text><text x="48" y="600" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">descripcion text NOT NULL</text><text x="48" y="616" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">activo boolean NOT NULL DEFAULT true</text><text x="48" y="632" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">orden integer NOT NULL DEFAULT 100</text><rect x="520" y="330" width="420" height="230" rx="4" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/><rect x="520" y="330" width="420" height="26" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="730.0" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">consulta</text><text x="528" y="374" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">PK id uuid DEFAULT gen_random_uuid()</text><text x="528" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">tipo text NOT NULL CHECK (placa|rostro)</text><text x="528" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">FK agente_id uuid NOT NULL → usuario_perfil.id</text><text x="528" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">motivo_codigo text NOT NULL  (sin FK, ver nota)</text><text x="528" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">motivo_texto text NULL</text><text x="528" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">placa text NULL</text><text x="528" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">resultado text NOT NULL</text><text x="528" y="486" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">estado text NOT NULL CHECK (5 estados)</text><text x="528" y="502" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">version_modelo text NULL · version_umbral text NULL</text><text x="528" y="518" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">creada_en timestamptz NOT NULL DEFAULT now()</text><text x="528" y="534" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">es_sintetico boolean NOT NULL DEFAULT true</text><text x="528" y="550" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">IDX consulta_agente_id_idx (agente_id)</text><rect x="1030" y="70" width="440" height="294" rx="4" fill="#fff" stroke="#9a5b00" stroke-width="1.5"/><rect x="1030" y="70" width="440" height="26" rx="4" fill="#fff4dc" stroke="#9a5b00" stroke-width="1.5"/><text x="1250.0" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9a5b00" text-anchor="middle" font-weight="bold">bitacora  (solo inserción)</text><text x="1038" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">PK id uuid DEFAULT gen_random_uuid()</text><text x="1038" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">ocurrido_en timestamptz NOT NULL DEFAULT clock_timestamp()</text><text x="1038" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">usuario_id uuid NULL · rol text NULL</text><text x="1038" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">tipo_evento text NOT NULL</text><text x="1038" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">motivo text NULL · parametros jsonb NULL</text><text x="1038" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">resultado text NULL · score double precision NULL</text><text x="1038" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">version_modelo text NULL · version_umbral text NULL</text><text x="1038" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">captura_id uuid NULL · consulta_id uuid NULL</text><text x="1038" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">codigo_error text NULL · id_traza text NULL</text><text x="1038" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">es_sintetico boolean NOT NULL DEFAULT true</text><text x="1038" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">IDX bitacora_ocurrido_en_idx · bitacora_usuario_id_idx</text><text x="1038" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">IDX bitacora_orden_idx (ocurrido_en DESC, id DESC)</text><text x="1038" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">IDX bitacora_tipo_evento_idx</text><text x="1038" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">TRG bitacora_sin_modificar (UPDATE, DELETE)</text><text x="1038" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">TRG bitacora_sin_truncar (TRUNCATE)</text><text x="1038" y="354" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">FN bitacora_solo_insercion()</text><path d="M520,140 L420,140" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="474.0" y="136.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">N:1</text><path d="M520,400 L470,400 L470,120 L420,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="476" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">N:1</text><path d="M520,440 L420,590" fill="none" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="430" y="520" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">lógica (sin FK)</text><path d="M1030,330 L940,400" fill="none" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="950" y="345" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">lógica (sin FK)</text><text x="1030" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Permisos del rol api_app (migración 0003):</text><text x="1030" y="444" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">bitacora: SELECT, INSERT</text><text x="1030" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">usuario_perfil, motivo_catalogo, alembic_version: SELECT</text><text x="1030" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">control_acceso, sesion, consulta: SELECT, INSERT, UPDATE</text><text x="1030" y="498" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Ningún rol, ni el dueño, puede UPDATE/DELETE/TRUNCATE</text><text x="1030" y="516" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">en bitacora (trigger, ADR-0005).</text><text x="40" y="800" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start">Nota: la bitácora no lleva claves foráneas a propósito: debe registrar aunque el usuario no exista (login fallido) y no puede bloquear borrados.</text><text x="40" y="820" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start">consulta.motivo_codigo se valida en la API contra el catálogo activo (no hay FK física). Tablas de HU-05/HU-06 (candidato, revision, captura_pendiente,</text><text x="40" y="840" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start">embedding_galeria, config_umbral) aún no están migradas: ver el modelo lógico. Fuente: services/api/alembic/versions/0002 y 0003.</text></svg>