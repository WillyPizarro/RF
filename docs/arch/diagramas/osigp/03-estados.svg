<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860"><defs><marker id="fl" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="fli" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="750.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Diagramas de estados — sesión, control de acceso, consulta y revisión</text><text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="bold">Sesión (tabla sesion.estado)</text><circle cx="60" cy="120" r="8" fill="#222"/><rect x="120" y="103" width="140" height="34" rx="17" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="190.0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">activa</text><path d="M68,120 L120,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="64" y="108" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">login OK</text><rect x="360" y="70" width="140" height="34" rx="17" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="430.0" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">cerrada</text><rect x="360" y="150" width="140" height="34" rx="17" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="430.0" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">vencida</text><path d="M260,115 L360,88" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="280" y="92" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">logout</text><path d="M260,125 L360,167" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="230" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">10 min sin actividad</text><path d="M190,103 L190,85 L160,85 L160,103" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="50" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222" text-anchor="start">refresh / actividad</text><circle cx="560" cy="120" r="10" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="560" cy="120" r="6" fill="#222"/><path d="M500,88 L550,116" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><path d="M500,167 L550,124" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="760" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="bold">Control de acceso (tabla control_acceso)</text><circle cx="780" cy="120" r="8" fill="#222"/><rect x="830" y="103" width="170" height="34" rx="17" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="915.0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">habilitada</text><path d="M788,120 L830,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><rect x="1180" y="103" width="170" height="34" rx="17" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="1265.0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">bloqueada</text><path d="M1000,112 L1180,112" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="1030" y="106" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">5.º intento fallido</text><path d="M1180,130 L1000,130" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="1040" y="148" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">pasan 15 min</text><path d="M915,103 L915,85 L880,85 L880,103" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="925" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#222" text-anchor="start">intento fallido (1-4) / login OK reinicia</text><text x="760" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start">Valores provisionales: ADR-0011 (PA #19). Se cuenta por texto de usuario, exista o no.</text><text x="40" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="bold">Consulta (tabla consulta.estado)</text><circle cx="60" cy="380" r="8" fill="#222"/><rect x="140" y="363" width="170" height="34" rx="17" fill="#fff" stroke="#6b6b6b" stroke-width="1.5"/><text x="225.0" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">en proceso</text><text x="140" y="412" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-style="italic">(transitorio, no se persiste)</text><path d="M68,380 L140,380" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><rect x="470" y="300" width="200" height="34" rx="17" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="570.0" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">completada</text><rect x="470" y="380" width="200" height="34" rx="17" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="570.0" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">error</text><rect x="470" y="470" width="200" height="34" rx="17" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="570.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">pendiente_revision</text><rect x="840" y="430" width="160" height="34" rx="17" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="920.0" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">revisada</text><rect x="840" y="510" width="160" height="34" rx="17" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="920.0" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">vencida</text><path d="M310,372 L470,317" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="300" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">placa: con/sin requisitoria;</text><text x="300" y="303" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">rostro: sin coincidencia /</text><text x="300" y="316" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">no concluyente / rechazada</text><path d="M310,384 L470,397" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="480" y="432" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">fuente no disponible /</text><text x="480" y="445" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">falla de bitácora</text><path d="M310,392 L470,487" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="330" y="480" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">rostro: candidato</text><path d="M670,480 L840,447" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="690" y="440" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">revisor decide</text><text x="690" y="453" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">(con motivo)</text><path d="M670,495 L840,527" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="660" y="548" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">24 h sin decisión</text><text x="660" y="561" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">(agente ve "No concluyente")</text><circle cx="1100" cy="400" r="10" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="1100" cy="400" r="6" fill="#222"/><path d="M670,317 L1092,396" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><path d="M670,397 L1090,400" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1000,447 L1092,405" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1000,527 L1094,408" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="40" y="610" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Regla 7: un error nunca termina en "sin requisitoria" ni "sin coincidencia". Placa y bitácora: implementado (HU-03, HU-07).</text><text x="40" y="670" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b6b6b" text-anchor="start" font-weight="bold">Revisión (tabla revision.estado, HU-06)</text><circle cx="60" cy="730" r="8" fill="#222"/><rect x="120" y="713" width="160" height="34" rx="17" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="200.0" y="735" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">pendiente</text><path d="M68,730 L120,730" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><rect x="430" y="680" width="160" height="34" rx="17" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="510.0" y="702" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">decidida</text><rect x="430" y="760" width="160" height="34" rx="17" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="510.0" y="782" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">vencida</text><path d="M280,722 L430,697" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="150" y="692" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">confirmar | descartar |</text><text x="150" y="705" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">no_concluyente + motivo</text><path d="M280,738 L430,777" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="290" y="790" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">24 h (proceso periódico)</text><text x="640" y="700" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Al pasar a decidida o vencida: la captura cifrada se borra</text><text x="640" y="718" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">y se registra CAPTURA_ELIMINADA (ADR-0008).</text><text x="640" y="742" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Un agente no decide sobre su propia consulta (ADR-0003).</text><rect x="1120" y="680" width="28" height="14" rx="2" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="1156" y="692" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Implementado (rama main)</text><rect x="1120" y="702" width="28" height="14" rx="2" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1156" y="714" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Diseñado, no construido (HU-05/06, HU-09, HU-10)</text></svg>