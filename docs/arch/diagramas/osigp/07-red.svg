<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780"><defs><marker id="fl" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="fli" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="750.0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Arquitectura de red general — MVP</text><rect x="30" y="120" width="240" height="70" rx="4" fill="#fff" stroke="#2e6b3a" stroke-width="1.5"/><rect x="30" y="120" width="240" height="26" rx="4" fill="#e3f1e5" stroke="#2e6b3a" stroke-width="1.5"/><text x="150.0" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2e6b3a" text-anchor="middle" font-weight="bold">Celular del usuario</text><text x="38" y="164" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">red móvil o Wi-Fi</text><text x="38" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">solo en línea (ADR-0010)</text><rect x="330" y="60" width="200" height="260" rx="4" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="430" y="85" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" text-anchor="middle" font-weight="bold">Internet</text><text x="430" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="middle">DNS: dominio del</text><text x="430" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="middle">proveedor → IP del VPS</text><rect x="590" y="60" width="600" height="520" rx="4" fill="#fafcff" stroke="#1f4e79" stroke-width="1.5"/><text x="890" y="85" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1f4e79" text-anchor="middle" font-weight="bold">VPS (IP pública) — puertos publicados: solo 80/tcp y 443/tcp</text><rect x="620" y="110" width="540" height="140" rx="4" fill="#eef5fc" stroke="#1f4e79" stroke-width="1.5" stroke-dasharray="6 4"/><text x="630" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="bold">Red docker "borde"</text><rect x="640" y="145" width="200" height="86" rx="4" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/><rect x="640" y="145" width="200" height="26" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="740.0" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">proxy (NGINX)</text><text x="648" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">80 → 443 (Let's Encrypt)</text><text x="648" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">443: /v1/* → api:8000,</text><text x="648" y="221" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">APK protegido; resto 404</text><rect x="920" y="145" width="220" height="70" rx="4" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/><rect x="920" y="145" width="220" height="26" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="1030.0" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">api (FastAPI)</text><text x="928" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">escucha solo en la red</text><text x="928" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">interna del compose</text><rect x="620" y="300" width="540" height="250" rx="4" fill="#f3faf4" stroke="#2e6b3a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="630" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2e6b3a" text-anchor="start" font-weight="bold">Red docker "interna" (sin salida publicada)</text><rect x="920" y="340" width="220" height="70" rx="4" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/><rect x="920" y="340" width="220" height="26" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="1030.0" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="bold">api (2.ª interfaz)</text><text x="928" y="384" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">llama a simuladores,</text><text x="928" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">al motor y a Supabase</text><rect x="640" y="340" width="220" height="70" rx="4" fill="#fff" stroke="#2e6b3a" stroke-width="1.5"/><rect x="640" y="340" width="220" height="26" rx="4" fill="#e3f1e5" stroke="#2e6b3a" stroke-width="1.5"/><text x="750.0" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2e6b3a" text-anchor="middle" font-weight="bold">simuladores</text><text x="648" y="384" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">puerto interno, sin</text><text x="648" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">publicar (ADR-0006)</text><rect x="920" y="450" width="220" height="70" rx="4" fill="#fff" stroke="#2e6b3a" stroke-width="1.5"/><rect x="920" y="450" width="220" height="26" rx="4" fill="#e3f1e5" stroke="#2e6b3a" stroke-width="1.5"/><text x="1030.0" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2e6b3a" text-anchor="middle" font-weight="bold">motor (biométrico)</text><text x="928" y="494" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">sin publicar; solo lo</text><text x="928" y="510" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">llama la API (ADR-0019)</text><rect x="640" y="450" width="220" height="54" rx="4" fill="#fff" stroke="#6b6b6b" stroke-width="1.5"/><rect x="640" y="450" width="220" height="26" rx="4" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5"/><text x="750.0" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b6b6b" text-anchor="middle" font-weight="bold">herramientas</text><text x="648" y="494" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">solo en mantenimiento</text><rect x="1250" y="160" width="220" height="220" rx="4" fill="#fffaf0" stroke="#9a5b00" stroke-width="1.5"/><text x="1360" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9a5b00" text-anchor="middle" font-weight="bold">Supabase (nube)</text><text x="1265" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Auth: HTTPS 443</text><text x="1265" y="245" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Postgres: 5432/6543 TLS</text><text x="1265" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">(pooler de sesión)</text><text x="1265" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Credenciales solo en</text><text x="1265" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">variables de entorno</text><text x="1265" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">del VPS (ADR-0009)</text><rect x="1250" y="420" width="220" height="110" rx="4" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1360" y="445" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" text-anchor="middle" font-weight="bold">Google (ML Kit)</text><text x="1265" y="475" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">Telemetría HTTPS desde</text><text x="1265" y="491" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">el celular, no desde el</text><text x="1265" y="507" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#222" text-anchor="start">VPS (brecha 10)</text><path d="M270,160 L640,185" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="320" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">HTTPS 443 (TLS)</text><path d="M840,190 L920,190" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1030,230 L1030,340" fill="none" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="1036" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">misma instancia</text><path d="M920,380 L860,380" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1030,410 L1030,450" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><path d="M920,470 L890,470 L890,396 L860,396" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="866" y="440" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">galería</text><path d="M1140,380 L1250,300" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#fl)"/><text x="1196" y="380" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">salida TLS</text><path d="M150,186 L150,600 L1360,600 L1360,530" fill="none" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fl)"/><text x="600" y="594" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="4">salida HTTPS del celular</text><text x="30" y="670" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start">Producción (documentado, no construido): red de la entidad, certificados gestionados por el MININTER, mTLS hacia las fuentes reales, MDM y control de</text><text x="30" y="688" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start">salida a dominios de terceros (TECH-DESIGN › Controles y brechas). El MVP no tiene VPN ni conexión con la red del MININTER.</text><text x="30" y="712" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start">Fuente: infra/docker-compose.yml (redes interna y borde), proxy NGINX (/v1/* hacia la API y APK protegido, ADR-0018), ADR-0006, ADR-0009 y ADR-0010.</text></svg>