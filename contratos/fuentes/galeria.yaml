openapi: 3.1.0
info:
  title: Fuente galeria (simulada)
  version: 1.0.0
  description: |
    Contrato de la galería biométrica: lista cerrada de personas habilitadas para la comparación
    facial (ADR-0004, ADR-0006, ADR-0008, contrato HU-08 v1). La implementa el contenedor
    `simuladores`; una fuente real puede reemplazarlo si cumple este mismo contrato.

    - `personas` incluye solo personas con al menos una foto cargada. Sin fotos cargadas,
      `personas` es `[]` (sin consentimiento, una persona no entra en la galería).
    - `version` es estable mientras no cambie el conjunto de fotos, y cambia cuando cambia. El
      consumidor la usa para invalidar su caché de embeddings.
    - Las fotos se descargan de la fuente `requisitorias-personas`
      (`GET /personas/{persona_id}/fotos/{foto_id}`).

    Tiempo de respuesta simulado: sin latencia artificial en operación normal (< 100 ms). El
    consumidor aplica un timeout de 3 s (ADR-0014).
servers:
  - url: http://simuladores:8001
    description: Simulador en la red interna de Docker (no publicado)
paths:
  /galeria:
    get:
      operationId: consultarGaleria
      summary: Versión de la galería y personas con fotos de referencia
      x-tiempo-respuesta-ms: 100
      responses:
        "200":
          description: Galería vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Galeria"
              examples:
                con_fotos:
                  summary: Galería con una persona
                  value:
                    version: g-3f2a9c41d07e5b18
                    personas:
                      - persona_id: SIM-P-0001
                        foto_ids: [SIM-P-0001__1, SIM-P-0001__2]
                    es_sintetico: true
                sin_fotos:
                  summary: Galería sin fotos cargadas
                  value:
                    version: g-e3b0c44298fc1c14
                    personas: []
                    es_sintetico: true
        "500":
          description: Falla de la fuente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                falla:
                  value:
                    codigo: ERROR_SIMULADO
                    mensaje: Falla simulada de la fuente
components:
  schemas:
    PersonaGaleria:
      type: object
      required: [persona_id, foto_ids]
      properties:
        persona_id:
          type: string
        foto_ids:
          type: array
          minItems: 1
          items:
            type: string
    Galeria:
      type: object
      required: [version, personas, es_sintetico]
      properties:
        version:
          type: string
          description: Cambia cuando cambia el conjunto de fotos.
        personas:
          type: array
          items:
            $ref: "#/components/schemas/PersonaGaleria"
        es_sintetico:
          type: boolean
          const: true
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          enum: [ERROR_SIMULADO]
        mensaje:
          type: string
